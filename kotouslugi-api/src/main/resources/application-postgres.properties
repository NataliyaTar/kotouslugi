# PostgreSQL (default profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/kotouslugi
spring.datasource.username=kotouslugi
spring.datasource.password=kotouslugi
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-postgres.sql

spring.h2.console.enabled=false
